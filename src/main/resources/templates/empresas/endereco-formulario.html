
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${endereco.id == null ? 'Cadastrar endereço' : 'Editar endereço'}">
        Endereço
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('empresas')}"></div>

<main class="container mt-4 mb-5">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 th:text="${endereco.id == null ? 'Cadastrar endereço' : 'Editar endereço'}">
            Endereço
        </h2>

        <a th:href="@{/empresas/{id}(id=${empresaId})}"
           class="btn btn-outline-secondary">
            Voltar
        </a>

    </div>

    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <!-- Formulário -->
    <form th:action="@{${endereco.id == null ?
                    '/empresas/' + empresaId + '/enderecos' :
                    '/empresas/' + empresaId + '/enderecos/' + endereco.id}}"
          method="post"
          th:object="${endereco}">

        <div class="card">

            <div class="card-header">
                <h5 class="mb-0">Informações do endereço</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- CEP -->
                    <div class="col-md-4 mb-3">

                        <label for="cep" class="form-label">
                            CEP
                        </label>

                        <input type="text"
                               id="cep"
                               th:field="*{cep}"
                               class="form-control"
                               maxlength="8"
                               minlength="8"
                               inputmode="numeric"
                               placeholder="Somente números"
                               required>

                        <div class="form-text">
                            Informe os 8 dígitos do CEP.
                        </div>

                    </div>

                    <!-- Logradouro -->
                    <div class="col-md-8 mb-3">

                        <label for="logradouro" class="form-label">
                            Logradouro
                        </label>

                        <input type="text"
                               id="logradouro"
                               th:field="*{logradouro}"
                               class="form-control"
                               maxlength="50"
                               required>

                    </div>

                    <!-- Número -->
                    <div class="col-md-4 mb-3">

                        <label for="numero" class="form-label">
                            Número
                        </label>

                        <input type="number"
                               id="numero"
                               th:field="*{numero}"
                               class="form-control"
                               min="0"
                               required>

                    </div>

                    <!-- Complemento -->
                    <div class="col-md-8 mb-3">

                        <label for="complemento" class="form-label">
                            Complemento
                        </label>

                        <input type="text"
                               id="complemento"
                               th:field="*{complemento}"
                               class="form-control"
                               maxlength="50">

                    </div>

                    <!-- Bairro -->
                    <div class="col-md-4 mb-3">

                        <label for="bairro" class="form-label">
                            Bairro
                        </label>

                        <input type="text"
                               id="bairro"
                               th:field="*{bairro}"
                               class="form-control"
                               maxlength="50"
                               required>

                    </div>

                    <!-- Cidade -->
                    <div class="col-md-5 mb-3">

                        <label for="cidade" class="form-label">
                            Cidade
                        </label>

                        <input type="text"
                               id="cidade"
                               th:field="*{cidade}"
                               class="form-control"
                               maxlength="50"
                               required>

                    </div>

                    <!-- Estado -->
                    <div class="col-md-3 mb-3">

                        <label for="estado" class="form-label">
                            Estado
                        </label>

                        <input type="text"
                               id="estado"
                               th:field="*{estado}"
                               class="form-control"
                               maxlength="50"
                               required>

                    </div>

                </div>

            </div>

        </div>

        <!-- Botões -->
        <div class="d-flex justify-content-end gap-2 mt-4">

            <a th:href="@{/empresas/{id}(id=${empresaId})}"
               class="btn btn-outline-secondary">
                Cancelar
            </a>

            <button type="submit"
                    class="btn btn-primary"
                    th:text="${endereco.id == null ? 'Cadastrar endereço' : 'Salvar alterações'}">
                Salvar
            </button>

        </div>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
