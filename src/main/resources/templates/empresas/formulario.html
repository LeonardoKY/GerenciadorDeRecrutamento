
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${empresa.id == null ? 'Cadastrar empresa' : 'Editar empresa'}">
    Cadastro de empresa
  </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('empresas')}"></div>

<main class="container mt-4 mb-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 th:text="${empresa.id == null ? 'Cadastrar empresa' : 'Editar empresa'}">
      Cadastro de empresa
    </h2>

    <a th:href="@{/empresas}"
       class="btn btn-outline-secondary">
      Voltar
    </a>
  </div>

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <form th:action="@{${empresa.id == null ?
                    '/empresas' :
                    '/empresas/' + empresa.id}}"
        method="post"
        th:object="${empresa}">

    <div class="card mb-4">

      <div class="card-header">
        <h5 class="mb-0">Dados da empresa</h5>
      </div>

      <div class="card-body">

        <div class="row">

          <!-- Nome -->
          <div class="col-md-6 mb-3">
            <label for="nome" class="form-label">
              Nome da empresa
            </label>

            <input type="text"
                   id="nome"
                   th:field="*{nome}"
                   class="form-control"
                   maxlength="50"
                   required>
          </div>

          <!-- CNPJ -->
          <div class="col-md-6 mb-3">
            <label for="cnpj" class="form-label">
              CNPJ
            </label>

            <input type="text"
                   id="cnpj"
                   th:field="*{cnpj}"
                   class="form-control"
                   maxlength="14"
                   placeholder="Somente números"
                   th:readonly="${empresa.id != null}"
                   required>

            <div class="form-text"
                 th:if="${empresa.id != null}">
              O CNPJ não pode ser alterado após o cadastro.
            </div>
          </div>

          <!-- Ano de fundação -->
          <div class="col-md-4 mb-3">
            <label for="anoFundacao" class="form-label">
              Ano de fundação
            </label>

            <input type="number"
                   id="anoFundacao"
                   th:field="*{anoFundacao}"
                   class="form-control"
                   min="1800"
                   required>
          </div>

          <!-- Quantidade de recrutadores -->
          <div class="col-md-4 mb-3">
            <label for="qtdeRecrutadores" class="form-label">
              Quantidade de recrutadores
            </label>

            <input type="number"
                   id="qtdeRecrutadores"
                   th:field="*{qtdeRecrutadores}"
                   class="form-control"
                   min="0"
                   required>
          </div>

          <!-- Clientes ativos -->
          <div class="col-md-4 mb-3">
            <label for="clientesAtivos" class="form-label">
              Clientes ativos
            </label>

            <input type="number"
                   id="clientesAtivos"
                   th:field="*{clientesAtivos}"
                   class="form-control"
                   min="0">
          </div>

          <!-- Porte -->
          <div class="col-md-6 mb-3">
            <label for="porte" class="form-label">
              Porte da empresa
            </label>

            <select id="porte"
                    th:field="*{porte}"
                    class="form-select"
                    required>

              <option value="">
                Selecione o porte
              </option>

              <option th:each="porte : ${portes}"
                      th:value="${porte}"
                      th:text="${porte}">
              </option>

            </select>
          </div>

        </div>

      </div>
    </div>

    <!-- Botões -->
    <div class="d-flex justify-content-end gap-2">

      <a th:href="@{/empresas}"
         class="btn btn-outline-secondary">
        Cancelar
      </a>

      <button type="submit"
              class="btn btn-primary"
              th:text="${empresa.id == null ? 'Cadastrar' : 'Salvar alterações'}">
        Salvar
      </button>

    </div>

  </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
