
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Empresas | VagaCerta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/cabecalho :: cabecalho('empresas')}"></div>

<main class="container py-4">

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <!-- Título e botão de cadastro -->
  <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">

    <div>
      <h1 class="h3 mb-1">Empresas</h1>

      <p class="text-secondary mb-0">
        Gerenciamento das empresas cadastradas.
      </p>
    </div>

    <a th:href="@{/empresas/nova}"
       class="btn btn-primary">
      Nova empresa
    </a>

  </div>

  <!-- Filtros -->
  <div class="card border-0 shadow-sm mb-4">

    <div class="card-body">

      <h2 class="h5 mb-3">
        Pesquisar empresas
      </h2>

      <form th:action="@{/empresas}"
            method="get">

        <div class="row g-3">

          <div class="col-md-6">

            <label for="nome"
                   class="form-label">
              Nome
            </label>

            <input type="text"
                   class="form-control"
                   id="nome"
                   name="nome"
                   th:value="${nome}"
                   placeholder="Nome da empresa">

          </div>

          <div class="col-md-6">

            <label for="porte"
                   class="form-label">
              Porte da empresa
            </label>

            <select class="form-select"
                    id="porte"
                    name="porte">

              <option value="">
                Todos os portes
              </option>

              <option th:each="porte : ${portes}"
                      th:value="${porte}"
                      th:text="${porte}"
                      th:selected="${porteSelecionado == porte}">
              </option>

            </select>

          </div>

        </div>

        <div class="d-flex gap-2 mt-4">

          <button type="submit"
                  class="btn btn-primary">
            Pesquisar
          </button>

          <a th:href="@{/empresas}"
             class="btn btn-outline-secondary">
            Limpar filtros
          </a>

        </div>

      </form>

    </div>

  </div>

  <!-- Resultados -->
  <div class="card border-0 shadow-sm">

    <div class="card-body">

      <div class="d-flex justify-content-between
                        align-items-center mb-3">

        <h2 class="h5 mb-0">
          Empresas cadastradas
        </h2>

        <span class="badge text-bg-secondary"
              th:text="${#lists.size(empresas)} + ' empresa(s)'">
                    0 empresas
                </span>

      </div>

      <!-- Nenhum resultado -->
      <div th:if="${#lists.isEmpty(empresas)}"
           class="alert alert-info mb-0">

        Nenhuma empresa encontrada.

      </div>

      <!-- Tabela de empresas -->
      <div th:unless="${#lists.isEmpty(empresas)}"
           class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">

          <tr>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Ano de fundação</th>
            <th>Porte</th>
            <th>Recrutadores</th>
            <th>Clientes ativos</th>
            <th class="text-end">Ações</th>
          </tr>

          </thead>

          <tbody>

          <tr th:each="empresa : ${empresas}">

            <td th:text="${empresa.nome}">
              Nome da empresa
            </td>

            <td th:text="${empresa.cnpj}">
              CNPJ
            </td>

            <td th:text="${empresa.anoFundacao}">
              Ano
            </td>

            <td>
                            <span class="badge text-bg-light border"
                                  th:text="${empresa.porte}">
                                Porte
                            </span>
            </td>

            <td th:text="${empresa.qtdeRecrutadores}">
              0
            </td>

            <td th:text="${empresa.clientesAtivos}">
              0
            </td>

            <td class="text-end">

              <a th:href="@{/empresas/{id}(id=${empresa.id})}"
                 class="btn btn-sm btn-outline-primary">
                Detalhes
              </a>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
