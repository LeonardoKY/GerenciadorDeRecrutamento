
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Nova inscrição</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('processos')}"></div>

<main class="container mt-4 mb-5">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Nova inscrição</h2>

    <a th:href="@{/processos}"
       class="btn btn-outline-secondary">
      Voltar
    </a>

  </div>

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <div class="card">

    <div class="card-header">
      <h5 class="mb-0">Dados da inscrição</h5>
    </div>

    <div class="card-body">

      <form th:action="@{/processos/inscrever}"
            method="post">

        <div class="row">

          <!-- Candidato -->
          <div class="col-md-6 mb-3">

            <label for="candidatoId" class="form-label">
              Candidato
            </label>

            <select id="candidatoId"
                    name="candidatoId"
                    class="form-select"
                    required>

              <option value="">
                Selecione um candidato
              </option>

              <option th:each="candidato : ${candidatos}"
                      th:value="${candidato.id}"
                      th:text="${candidato.nome}">
              </option>

            </select>

          </div>

          <!-- Vaga -->
          <div class="col-md-6 mb-3">

            <label for="vagaId" class="form-label">
              Vaga
            </label>

            <select id="vagaId"
                    name="vagaId"
                    class="form-select"
                    required>

              <option value="">
                Selecione uma vaga
              </option>

              <option th:each="vaga : ${vagas}"
                      th:if="${vaga.status.name() == 'ABERTA'}"
                      th:value="${vaga.id}"
                      th:text="${vaga.empresa.nome + ' - ' + vaga.area + ' - ' + vaga.modalidade}">
              </option>

            </select>

          </div>

          <!-- Pretensão salarial -->
          <div class="col-md-6 mb-3">

            <label for="pretensaoSalarial" class="form-label">
              Pretensão salarial (R$)
            </label>

            <input type="number"
                   id="pretensaoSalarial"
                   name="pretensaoSalarial"
                   class="form-control"
                   min="0.01"
                   step="0.01"
                   placeholder="Ex.: 3500.00"
                   required>

          </div>

        </div>

        <div class="alert alert-info">
          O processo será criado automaticamente com o status
          <strong>INSCRITO</strong> e a data da inscrição será
          registrada pelo sistema.
        </div>

        <div class="d-flex justify-content-end gap-2">

          <a th:href="@{/processos}"
             class="btn btn-outline-secondary">
            Cancelar
          </a>

          <button type="submit"
                  class="btn btn-primary">
            Realizar inscrição
          </button>

        </div>

      </form>

    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
