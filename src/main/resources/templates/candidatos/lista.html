<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Candidatos | VagaCerta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/cabecalho :: cabecalho('candidatos')}"></div>

<main class="container py-4">

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <!-- Título e botão de cadastro -->
  <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">

    <div>
      <h1 class="h3 mb-1">Candidatos</h1>
      <p class="text-secondary mb-0">
        Gerenciamento dos candidatos cadastrados.
      </p>
    </div>

    <a th:href="@{/candidatos/novo}"
       class="btn btn-primary">
      Novo candidato
    </a>

  </div>

  <!-- Filtros -->
  <div class="card border-0 shadow-sm mb-4">

    <div class="card-body">

      <h2 class="h5 mb-3">Pesquisar candidatos</h2>

      <form th:action="@{/candidatos}"
            method="get">

        <div class="row g-3">

          <div class="col-md-4">

            <label for="nome"
                   class="form-label">
              Nome
            </label>

            <input type="text"
                   class="form-control"
                   id="nome"
                   name="nome"
                   th:value="${nome}"
                   placeholder="Nome do candidato">

          </div>

          <div class="col-md-4">

            <label for="cpf"
                   class="form-label">
              CPF
            </label>

            <input type="text"
                   class="form-control"
                   id="cpf"
                   name="cpf"
                   th:value="${cpf}"
                   placeholder="Somente números">

          </div>

          <div class="col-md-4">

            <label for="email"
                   class="form-label">
              E-mail
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   th:value="${email}"
                   placeholder="E-mail do candidato">

          </div>

          <div class="col-md-4">

            <label for="formacao"
                   class="form-label">
              Formação
            </label>

            <select class="form-select"
                    id="formacao"
                    name="formacao">

              <option value="">
                Todas as formações
              </option>

              <option value="TECNICO"
                      th:selected="${formacao == 'TECNICO'}">
                Técnico
              </option>

              <option value="GRADUACAO"
                      th:selected="${formacao == 'GRADUACAO'}">
                Graduação
              </option>

              <option value="POS_GRADUACAO"
                      th:selected="${formacao == 'POS_GRADUACAO'}">
                Pós-graduação
              </option>

              <option value="MESTRADO"
                      th:selected="${formacao == 'MESTRADO'}">
                Mestrado
              </option>

            </select>

          </div>

          <div class="col-md-4">

            <label for="cidade"
                   class="form-label">
              Cidade
            </label>

            <input type="text"
                   class="form-control"
                   id="cidade"
                   name="cidade"
                   th:value="${cidade}"
                   placeholder="Cidade">

          </div>

          <div class="col-md-4">

            <label for="estado"
                   class="form-label">
              Estado
            </label>

            <input type="text"
                   class="form-control"
                   id="estado"
                   name="estado"
                   th:value="${estado}"
                   placeholder="Estado">

          </div>

        </div>

        <div class="d-flex gap-2 mt-4">

          <button type="submit"
                  class="btn btn-primary">
            Pesquisar
          </button>

          <a th:href="@{/candidatos}"
             class="btn btn-outline-secondary">
            Limpar filtros
          </a>

        </div>

      </form>

    </div>

  </div>

  <!-- Resultados -->
  <div class="card border-0 shadow-sm">

    <div class="card-body">

      <div class="d-flex justify-content-between
                        align-items-center mb-3">

        <h2 class="h5 mb-0">
          Resultados
        </h2>

        <span class="badge text-bg-secondary"
              th:text="${#lists.size(candidatos)} + ' candidato(s)'">
                </span>

      </div>

      <div th:if="${#lists.isEmpty(candidatos)}"
           class="alert alert-info mb-0">

        Nenhum candidato encontrado.

      </div>

      <div th:unless="${#lists.isEmpty(candidatos)}"
           class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">

          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Formação</th>
            <th>Cidade</th>
            <th class="text-end">Ações</th>
          </tr>

          </thead>

          <tbody>

          <tr th:each="candidato : ${candidatos}">

            <td th:text="${candidato.nome}">
            </td>

            <td th:text="${candidato.cpf}">
            </td>

            <td th:text="${candidato.email}">
            </td>

            <td th:text="${candidato.formacao}">
            </td>

            <td th:text="${candidato.endereco != null ?
                                candidato.endereco.cidade : 'Não informado'}">
            </td>

            <td class="text-end">

              <a th:href="@{/candidatos/{id}(id=${candidato.id})}"
                 class="btn btn-sm btn-outline-primary">
                Detalhes
              </a>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
