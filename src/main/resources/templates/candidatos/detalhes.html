
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Detalhes do candidato | VagaCerta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/cabecalho :: cabecalho('candidatos')}"></div>

<main class="container py-4">

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">

    <div>

      <a th:href="@{/candidatos}"
         class="text-decoration-none">
        ← Voltar para candidatos
      </a>

      <h1 class="h3 mt-3 mb-1"
          th:text="${candidato.nome}">
      </h1>

      <p class="text-secondary mb-0">
        Informações cadastrais do candidato.
      </p>

    </div>

    <div class="d-flex gap-2">

      <a th:href="@{/candidatos/{id}/editar(id=${candidato.id})}"
         class="btn btn-primary">
        Editar
      </a>

      <form th:action="@{/candidatos/{id}/excluir(id=${candidato.id})}"
            method="post"
            onsubmit="return confirm('Deseja realmente excluir este candidato?');">

        <button type="submit"
                class="btn btn-outline-danger">
          Excluir
        </button>

      </form>

    </div>

  </div>

  <!-- Dados pessoais -->
  <div class="card border-0 shadow-sm mb-4">

    <div class="card-body p-4">

      <h2 class="h5 mb-4">
        Dados pessoais
      </h2>

      <div class="row g-4">

        <div class="col-md-6">

          <label class="text-secondary small">
            Nome completo
          </label>

          <p class="fw-semibold mb-0"
             th:text="${candidato.nome}">
          </p>

        </div>

        <div class="col-md-6">

          <label class="text-secondary small">
            CPF
          </label>

          <p class="fw-semibold mb-0"
             th:text="${candidato.cpf}">
          </p>

        </div>

        <div class="col-md-6">

          <label class="text-secondary small">
            E-mail
          </label>

          <p class="fw-semibold mb-0"
             th:text="${candidato.email}">
          </p>

        </div>

        <div class="col-md-6">

          <label class="text-secondary small">
            Data de nascimento
          </label>

          <p class="fw-semibold mb-0"
             th:text="${#temporals.format(candidato.nascimento, 'dd/MM/yyyy')}">
          </p>

        </div>

        <div class="col-md-4">

          <label class="text-secondary small">
            Anos de experiência
          </label>

          <p class="fw-semibold mb-0"
             th:text="${candidato.anosExperiencia + ' ano(s)'}">
          </p>

        </div>

        <div class="col-md-4">

          <label class="text-secondary small">
            Gênero
          </label>

          <p class="fw-semibold mb-0"
             th:text="${candidato.genero}">
          </p>

        </div>

        <div class="col-md-4">

          <label class="text-secondary small">
            Formação
          </label>

          <p class="fw-semibold mb-0"
             th:text="${candidato.formacao}">
          </p>

        </div>

      </div>

    </div>

  </div>

  <!-- Endereço -->
  <div class="card border-0 shadow-sm mb-4">

    <div class="card-body p-4">

      <div class="d-flex justify-content-between
                        align-items-center mb-4">

        <h2 class="h5 mb-0">
          Endereço
        </h2>

        <a th:href="@{/candidatos/{id}/editar(id=${candidato.id})}"
           class="btn btn-sm btn-outline-primary"
           th:if="${endereco == null}">
          Adicionar endereço
        </a>

      </div>

      <!-- Quando não existe endereço -->
      <div th:if="${endereco == null}"
           class="alert alert-info mb-0">

        Este candidato ainda não possui endereço cadastrado.

      </div>

      <!-- Quando existe endereço -->
      <div th:if="${endereco != null}">

        <div class="row g-4">

          <div class="col-md-4">

            <label class="text-secondary small">
              CEP
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.cep}">
            </p>

          </div>

          <div class="col-md-5">

            <label class="text-secondary small">
              Logradouro
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.logradouro}">
            </p>

          </div>

          <div class="col-md-3">

            <label class="text-secondary small">
              Número
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.numero}">
            </p>

          </div>

          <div class="col-md-4">

            <label class="text-secondary small">
              Complemento
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.complemento != null &&
                               !#strings.isEmpty(endereco.complemento) ?
                               endereco.complemento : 'Não informado'}">
            </p>

          </div>

          <div class="col-md-4">

            <label class="text-secondary small">
              Bairro
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.bairro}">
            </p>

          </div>

          <div class="col-md-4">

            <label class="text-secondary small">
              Cidade
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.cidade}">
            </p>

          </div>

          <div class="col-md-4">

            <label class="text-secondary small">
              Estado
            </label>

            <p class="fw-semibold mb-0"
               th:text="${endereco.estado}">
            </p>

          </div>

        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-end">

          <form th:action="@{/candidatos/{id}/endereco/excluir(id=${candidato.id})}"
                method="post"
                onsubmit="return confirm('Deseja realmente excluir o endereço?');">

            <button type="submit"
                    class="btn btn-outline-danger btn-sm">
              Excluir endereço
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
