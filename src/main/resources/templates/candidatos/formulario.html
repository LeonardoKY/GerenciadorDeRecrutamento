
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${candidato.id == null ? 'Cadastrar candidato' : 'Editar candidato'}">
        Cadastro de candidato
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('candidatos')}"></div>

<main class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${candidato.id == null ? 'Cadastrar candidato' : 'Editar candidato'}">
            Cadastro de candidato
        </h2>

        <a th:href="@{/candidatos}"
           class="btn btn-outline-secondary">
            Voltar
        </a>
    </div>

    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <form th:action="@{${candidato.id == null ?
                    '/candidatos' :
                    '/candidatos/' + candidato.id}}"
          method="post"
          th:object="${candidato}">

        <!-- Dados pessoais -->
        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Dados pessoais</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="nome" class="form-label">
                            Nome
                        </label>

                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="cpf" class="form-label">
                            CPF
                        </label>

                        <input type="text"
                               id="cpf"
                               th:field="*{cpf}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nascimento" class="form-label">
                            Data de nascimento
                        </label>

                        <input type="date"
                               id="nascimento"
                               th:field="*{nascimento}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="anosExperiencia" class="form-label">
                            Anos de experiência
                        </label>

                        <input type="number"
                               id="anosExperiencia"
                               th:field="*{anosExperiencia}"
                               class="form-control"
                               min="0">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="genero" class="form-label">
                            Gênero
                        </label>

                        <select id="genero"
                                th:field="*{genero}"
                                class="form-select">

                            <option value="">Selecione</option>

                            <option th:each="genero : ${generos}"
                                    th:value="${genero}"
                                    th:text="${genero}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="formacao" class="form-label">
                            Formação
                        </label>

                        <select id="formacao"
                                th:field="*{formacao}"
                                class="form-select">

                            <option value="">Selecione</option>

                            <option th:each="formacao : ${formacoes}"
                                    th:value="${formacao}"
                                    th:text="${formacao}">
                            </option>

                        </select>
                    </div>

                </div>

            </div>
        </div>

        <!-- Endereço -->
        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Endereço</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label for="cep" class="form-label">
                            CEP
                        </label>

                        <input type="text"
                               id="cep"
                               name="cep"
                               th:value="${endereco != null ? endereco.cep : ''}"
                               class="form-control">
                    </div>

                    <div class="col-md-8 mb-3">
                        <label for="logradouro" class="form-label">
                            Logradouro
                        </label>

                        <input type="text"
                               id="logradouro"
                               name="logradouro"
                               th:value="${endereco != null ? endereco.logradouro : ''}"
                               class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="numero" class="form-label">
                            Número
                        </label>

                        <input type="text"
                               id="numero"
                               name="numero"
                               th:value="${endereco != null ? endereco.numero : ''}"
                               class="form-control">
                    </div>

                    <div class="col-md-8 mb-3">
                        <label for="complemento" class="form-label">
                            Complemento
                        </label>

                        <input type="text"
                               id="complemento"
                               name="complemento"
                               th:value="${endereco != null ? endereco.complemento : ''}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="bairro" class="form-label">
                            Bairro
                        </label>

                        <input type="text"
                               id="bairro"
                               name="bairro"
                               th:value="${endereco != null ? endereco.bairro : ''}"
                               class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="cidade" class="form-label">
                            Cidade
                        </label>

                        <input type="text"
                               id="cidade"
                               name="cidade"
                               th:value="${endereco != null ? endereco.cidade : ''}"
                               class="form-control">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label for="estado" class="form-label">
                            Estado
                        </label>

                        <input type="text"
                               id="estado"
                               name="estado"
                               th:value="${endereco != null ? endereco.estado : ''}"
                               class="form-control"
                               maxlength="2">
                    </div>

                </div>

            </div>
        </div>

        <!-- Botões -->
        <div class="d-flex justify-content-end gap-2">

            <a th:href="@{/candidatos}"
               class="btn btn-outline-secondary">
                Cancelar
            </a>

            <button type="submit"
                    class="btn btn-primary"
                    th:text="${candidato.id == null ? 'Cadastrar' : 'Salvar alterações'}">
                Salvar
            </button>

        </div>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
