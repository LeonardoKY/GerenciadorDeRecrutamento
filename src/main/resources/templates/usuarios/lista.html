
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Usuários</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('usuarios')}"></div>

<main class="container mt-4 mb-5">

  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Usuários</h2>

    <a th:href="@{/usuarios/novo}"
       class="btn btn-primary">
      Novo usuário
    </a>

  </div>

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <!-- Tabela de usuários -->
  <div class="card">

    <div class="card-header">
      <h5 class="mb-0">Usuários cadastrados</h5>
    </div>

    <div class="card-body">

      <div th:if="${#lists.isEmpty(usuarios)}"
           class="alert alert-info mb-0">
        Nenhum usuário cadastrado.
      </div>

      <div th:unless="${#lists.isEmpty(usuarios)}"
           class="table-responsive">

        <table class="table table-striped table-hover align-middle">

          <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Status</th>
            <th class="text-center">Ações</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="usuario : ${usuarios}">

            <td th:text="${usuario.nome}">
              Nome do usuário
            </td>

            <td th:text="${usuario.email}">
              usuario@email.com
            </td>

            <td>
                            <span class="badge bg-primary"
                                  th:if="${usuario.perfil.name() == 'ADMIN'}">
                                ADMIN
                            </span>

              <span class="badge bg-info text-dark"
                    th:if="${usuario.perfil.name() == 'RECRUTADOR'}">
                                RECRUTADOR
                            </span>
            </td>

            <td>
                            <span class="badge bg-success"
                                  th:if="${usuario.ativo}">
                                Ativo
                            </span>

              <span class="badge bg-secondary"
                    th:unless="${usuario.ativo}">
                                Inativo
                            </span>
            </td>

            <td class="text-center">

              <div class="d-flex justify-content-center gap-2">

                <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"
                   class="btn btn-sm btn-warning">
                  Editar
                </a>

                <!-- Desativar -->
                <form th:if="${usuario.ativo}"
                      th:action="@{/usuarios/{id}/status(id=${usuario.id})}"
                      method="post"
                      onsubmit="return confirm('Deseja realmente desativar este usuário?');">

                  <input type="hidden"
                         name="ativo"
                         value="false">

                  <button type="submit"
                          class="btn btn-sm btn-danger">
                    Desativar
                  </button>

                </form>

                <!-- Ativar -->
                <form th:unless="${usuario.ativo}"
                      th:action="@{/usuarios/{id}/status(id=${usuario.id})}"
                      method="post">

                  <input type="hidden"
                         name="ativo"
                         value="true">

                  <button type="submit"
                          class="btn btn-sm btn-success">
                    Ativar
                  </button>

                </form>

              </div>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
