
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Vagas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('vagas')}"></div>

<main class="container mt-4 mb-5">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Vagas</h2>

        <a th:href="@{/vagas/nova}"
           class="btn btn-primary">
            Nova vaga
        </a>

    </div>

    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <!-- Filtros -->
    <div class="card mb-4">

        <div class="card-header">
            <h5 class="mb-0">Pesquisar vagas</h5>
        </div>

        <div class="card-body">

            <form th:action="@{/vagas}" method="get">

                <div class="row">

                    <!-- Data de abertura inicial -->
                    <div class="col-md-3 mb-3">
                        <label for="aberturaInicial" class="form-label">
                            Abertura a partir de
                        </label>

                        <input type="date"
                               id="aberturaInicial"
                               name="aberturaInicial"
                               class="form-control"
                               th:value="${aberturaInicial}">
                    </div>

                    <!-- Data de abertura final -->
                    <div class="col-md-3 mb-3">
                        <label for="aberturaFinal" class="form-label">
                            Abertura até
                        </label>

                        <input type="date"
                               id="aberturaFinal"
                               name="aberturaFinal"
                               class="form-control"
                               th:value="${aberturaFinal}">
                    </div>

                    <!-- Data de fechamento inicial -->
                    <div class="col-md-3 mb-3">
                        <label for="fechamentoInicial" class="form-label">
                            Fechamento a partir de
                        </label>

                        <input type="date"
                               id="fechamentoInicial"
                               name="fechamentoInicial"
                               class="form-control"
                               th:value="${fechamentoInicial}">
                    </div>

                    <!-- Data de fechamento final -->
                    <div class="col-md-3 mb-3">
                        <label for="fechamentoFinal" class="form-label">
                            Fechamento até
                        </label>

                        <input type="date"
                               id="fechamentoFinal"
                               name="fechamentoFinal"
                               class="form-control"
                               th:value="${fechamentoFinal}">
                    </div>

                    <!-- Modalidade -->
                    <div class="col-md-3 mb-3">
                        <label for="modalidade" class="form-label">
                            Modalidade
                        </label>

                        <select id="modalidade"
                                name="modalidade"
                                class="form-select">

                            <option value="">Todas</option>

                            <option th:each="modalidade : ${modalidades}"
                                    th:value="${modalidade}"
                                    th:text="${modalidade}"
                                    th:selected="${modalidadeSelecionada == modalidade}">
                            </option>

                        </select>
                    </div>

                    <!-- Senioridade -->
                    <div class="col-md-3 mb-3">
                        <label for="senioridade" class="form-label">
                            Senioridade
                        </label>

                        <select id="senioridade"
                                name="senioridade"
                                class="form-select">

                            <option value="">Todas</option>

                            <option th:each="senioridade : ${senioridades}"
                                    th:value="${senioridade}"
                                    th:text="${senioridade}"
                                    th:selected="${senioridadeSelecionada == senioridade}">
                            </option>

                        </select>
                    </div>

                    <!-- Área -->
                    <div class="col-md-3 mb-3">
                        <label for="area" class="form-label">
                            Área de atuação
                        </label>

                        <select id="area"
                                name="area"
                                class="form-select">

                            <option value="">Todas</option>

                            <option th:each="area : ${areas}"
                                    th:value="${area}"
                                    th:text="${area}"
                                    th:selected="${areaSelecionada == area}">
                            </option>

                        </select>
                    </div>

                    <!-- Status -->
                    <div class="col-md-3 mb-3">
                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select id="status"
                                name="status"
                                class="form-select">

                            <option value="">Todos</option>

                            <option th:each="status : ${statusVagas}"
                                    th:value="${status}"
                                    th:text="${status}"
                                    th:selected="${statusSelecionado == status}">
                            </option>

                        </select>
                    </div>

                </div>

                <!-- Botões dos filtros -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/vagas}"
                       class="btn btn-outline-secondary">
                        Limpar filtros
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Pesquisar
                    </button>

                </div>

            </form>

        </div>
    </div>

    <!-- Tabela de vagas -->
    <div class="card">

        <div class="card-header">
            <h5 class="mb-0">Vagas cadastradas</h5>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(vagas)}"
                 class="alert alert-info mb-0">
                Nenhuma vaga encontrada.
            </div>

            <div th:unless="${#lists.isEmpty(vagas)}"
                 class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Área</th>
                        <th>Modalidade</th>
                        <th>Senioridade</th>
                        <th>Salário mensal</th>
                        <th>Abertura</th>
                        <th>Fechamento</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="vaga : ${vagas}">

                        <td th:text="${vaga.empresa.nome}">
                            Empresa
                        </td>

                        <td th:text="${vaga.area}">
                            Área
                        </td>

                        <td th:text="${vaga.modalidade}">
                            Modalidade
                        </td>

                        <td th:text="${vaga.senioridade}">
                            Senioridade
                        </td>

                        <td th:text="${#numbers.formatCurrency(vaga.salarioMensal)}">
                            R$ 0,00
                        </td>

                        <td th:text="${vaga.abertura != null ?
                            #temporals.format(vaga.abertura, 'dd/MM/yyyy') : '-'}">
                            Data de abertura
                        </td>

                        <td th:text="${vaga.fechamento != null ?
                            #temporals.format(vaga.fechamento, 'dd/MM/yyyy') : 'Não definida'}">
                            Data de fechamento
                        </td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${vaga.status.name() == 'ABERTA'}"
                                  th:text="${vaga.status}">
                                ABERTA
                            </span>

                            <span class="badge bg-secondary"
                                  th:if="${vaga.status.name() == 'FECHADA'}"
                                  th:text="${vaga.status}">
                                FECHADA
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${vaga.status.name() == 'CANCELADA'}"
                                  th:text="${vaga.status}">
                                CANCELADA
                            </span>
                        </td>

                        <td class="text-center">

                            <a th:href="@{/vagas/{id}(id=${vaga.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Detalhes
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
