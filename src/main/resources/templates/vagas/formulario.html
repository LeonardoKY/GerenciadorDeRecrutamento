
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${vaga.id == null ? 'Cadastrar vaga' : 'Editar vaga'}">
    Cadastro de vaga
  </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/cabecalho :: cabecalho('vagas')}"></div>

<main class="container mt-4 mb-5">

  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 th:text="${vaga.id == null ? 'Cadastrar vaga' : 'Editar vaga'}">
      Cadastro de vaga
    </h2>

    <a th:href="${vaga.id == null ?
                    '/vagas' :
                    '/vagas/' + vaga.id}"
       class="btn btn-outline-secondary">
      Voltar
    </a>

  </div>

  <div th:replace="~{fragments/mensagens :: mensagens}"></div>

  <!-- Formulário -->
  <form th:action="@{${vaga.id == null ?
                    '/vagas' :
                    '/vagas/' + vaga.id}}"
        method="post"
        th:object="${vaga}">

    <div class="card mb-4">

      <div class="card-header">
        <h5 class="mb-0">Informações da vaga</h5>
      </div>

      <div class="card-body">

        <div class="row">

          <!-- Empresa -->
          <div class="col-md-6 mb-3">

            <label for="empresaId" class="form-label">
              Empresa
            </label>

            <!-- Cadastro: permite selecionar uma empresa -->
            <select th:if="${vaga.id == null}"
                    id="empresaId"
                    name="empresaId"
                    class="form-select"
                    required>

              <option value="">
                Selecione uma empresa
              </option>

              <option th:each="empresa : ${empresas}"
                      th:value="${empresa.id}"
                      th:text="${empresa.nome}">
              </option>

            </select>

            <!-- Edição: apresenta a empresa atual -->
            <input th:if="${vaga.id != null}"
                   type="text"
                   class="form-control"
                   th:value="${vaga.empresa.nome}"
                   readonly>

          </div>

          <!-- Salário -->
          <div class="col-md-6 mb-3">

            <label for="salarioMensal" class="form-label">
              Salário mensal (R$)
            </label>

            <input type="number"
                   id="salarioMensal"
                   th:field="*{salarioMensal}"
                   class="form-control"
                   min="0.01"
                   step="0.01"
                   required>

          </div>

          <!-- Abertura -->
          <div class="col-md-6 mb-3">

            <label for="abertura" class="form-label">
              Data e horário de abertura
            </label>

            <input type="datetime-local"
                   id="abertura"
                   th:field="*{abertura}"
                   class="form-control"
                   required>

          </div>

          <!-- Fechamento -->
          <div class="col-md-6 mb-3">

            <label for="fechamento" class="form-label">
              Data e horário de fechamento
            </label>

            <input type="datetime-local"
                   id="fechamento"
                   th:field="*{fechamento}"
                   class="form-control">

            <div class="form-text">
              Deixe em branco caso a vaga não tenha uma data de fechamento definida.
            </div>

          </div>

          <!-- Modalidade -->
          <div class="col-md-6 mb-3">

            <label for="modalidade" class="form-label">
              Modalidade
            </label>

            <select id="modalidade"
                    th:field="*{modalidade}"
                    class="form-select"
                    required>

              <option value="">
                Selecione a modalidade
              </option>

              <option th:each="modalidade : ${modalidades}"
                      th:value="${modalidade}"
                      th:text="${modalidade}">
              </option>

            </select>

          </div>

          <!-- Senioridade -->
          <div class="col-md-6 mb-3">

            <label for="senioridade" class="form-label">
              Senioridade
            </label>

            <select id="senioridade"
                    th:field="*{senioridade}"
                    class="form-select"
                    required>

              <option value="">
                Selecione a senioridade
              </option>

              <option th:each="senioridade : ${senioridades}"
                      th:value="${senioridade}"
                      th:text="${senioridade}">
              </option>

            </select>

          </div>

          <!-- Área -->
          <div class="col-md-6 mb-3">

            <label for="area" class="form-label">
              Área de atuação
            </label>

            <select id="area"
                    th:field="*{area}"
                    class="form-select"
                    required>

              <option value="">
                Selecione a área
              </option>

              <option th:each="area : ${areas}"
                      th:value="${area}"
                      th:text="${area}">
              </option>

            </select>

          </div>

          <!-- Status -->
          <div class="col-md-6 mb-3">

            <label for="status" class="form-label">
              Status da vaga
            </label>

            <select id="status"
                    th:field="*{status}"
                    class="form-select"
                    required>

              <option value="">
                Selecione o status
              </option>

              <option th:each="status : ${statusVagas}"
                      th:value="${status}"
                      th:text="${status}">
              </option>

            </select>

          </div>

        </div>

      </div>
    </div>

    <!-- Botões -->
    <div class="d-flex justify-content-end gap-2">

      <a th:href="${vaga.id == null ?
                        '/vagas' :
                        '/vagas/' + vaga.id}"
         class="btn btn-outline-secondary">
        Cancelar
      </a>

      <button type="submit"
              class="btn btn-primary"
              th:text="${vaga.id == null ? 'Cadastrar vaga' : 'Salvar alterações'}">
        Salvar
      </button>

    </div>

  </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
